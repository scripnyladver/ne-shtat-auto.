
name: Build NE SHTAT Auto Cockpit APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org ru.neshtat --project-name ne_shtat_auto_cockpit .

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Restore app native integration
        run: |
          mkdir -p android/app/src/main/kotlin/com/neshtat/autocockpit
          cp native/MainActivity.kt android/app/src/main/kotlin/com/neshtat/autocockpit/MainActivity.kt
          cp native/CockpitNotificationListener.kt android/app/src/main/kotlin/com/neshtat/autocockpit/CockpitNotificationListener.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp native/app.build.gradle android/app/build.gradle

      - name: Check for obsolete Android embedding
        run: |
          echo "Searching for Android v1 embedding references..."
          grep -RInE 'io\.flutter\.app|io\.flutter\.view|PluginRegistry\.Registrar|FlutterApplication' android native || true

      - name: Check MapKit API key
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: |
          if [ -z "$MAPKIT_API_KEY" ]; then
            echo "::error::MAPKIT_API_KEY GitHub Secret is missing"
            exit 1
          fi

      - name: Create debug signing keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=MAPKIT_API_KEY="$MAPKIT_API_KEY"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ne-shtat-auto-cockpit-0.2.0-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          
